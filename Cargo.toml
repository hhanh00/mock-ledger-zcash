[package]
name = "mock-ledger-zcash"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A mock server for the Ledger Zcash hardware wallet, used as an e2e mocking service when testing Ledger from zkool"

[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
bip39 = "2.1"
hex = "0.4"
sha2 = "0.10"
anyhow = "1"
byteorder = "1"
blake2b_simd = "1"
ff = "0.13"
pasta_curves = "0.5"
orchard = { version = "0.15.5", default-features = false, features = ["std"] }
rand = "0.8"
secp256k1 = "0.29"
zcash_transparent = { version = "0.10", features = ["transparent-inputs"] }
zcash_keys = { version = "0.16", features = ["orchard", "sapling", "transparent-inputs"] }
zcash_address = "0.13"
zcash_protocol = { version = "0.10", features = ["local-consensus"] }
zip32 = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
warp = { version = "0.4", features = ["server"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_unstable, values("nu7"))'] }
