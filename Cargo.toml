[package]
name = "mock-ledger-zcash"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A mock server for the Ledger Zcash hardware wallet, used as an e2e mocking service when testing Ledger from zkool"

[dependencies]
clap = { version = "4", features = ["derive"] }
bip39 = "2.1"
hex = "0.4"
sha2 = "0.10"
zcash_keys = { version = "0.16", features = ["orchard", "sapling", "transparent-inputs"] }
zcash_protocol = { version = "0.10", features = ["local-consensus"] }
zip32 = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
warp = { version = "0.4", features = ["server"] }
